# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: discovery-registry-gitlab-auth
spec:
  description: |
    Verify that a registry DiscoveryPolicy against the real GitLab container
    registry (registry.gitlab.com) succeeds. GitLab returns 401 with a Bearer
    challenge even for public repos, so this exercises the anonymous OCI token
    flow: fetch a token from the challenge realm and retry with an Authorization
    header. Requires cluster egress to gitlab.com.
  steps:
    - name: Create DiscoveryPolicy against real GitLab registry
      try:
        - apply:
            file: 01-discoverypolicy.yaml
    - name: Assert bearer-auth discovery succeeded
      try:
        - assert:
            timeout: 180s
            file: 02-assert-discovery-status.yaml
      catch:
        - describe:
            apiVersion: drop.corewire.io/v1alpha1
            kind: DiscoveryPolicy
            name: e2e-discovery-registry-gitlab-auth
    - name: Cleanup
      try:
        - delete:
            ref:
              apiVersion: drop.corewire.io/v1alpha1
              kind: DiscoveryPolicy
              name: e2e-discovery-registry-gitlab-auth
